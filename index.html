<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Suporte — Omni</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--bg2:#181c27;--bg3:#1e2333;--border:rgba(255,255,255,0.07);--text:#f0f2f8;--text2:#8b92a8;--text3:#555d75;--accent:#4f8ef7;--green:#2dd4a0;--amber:#f59e0b;--red:#f26c6c;--purple:#a78bfa;--radius:12px;--rsm:8px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px}
.header-left h1{font-size:20px;font-weight:700;letter-spacing:-.4px}
.header-left p{font-size:12px;color:var(--text2);margin-top:3px}
/* Date picker */
.date-picker{position:relative}
.dp-btn{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:500;padding:8px 14px;border-radius:var(--rsm);cursor:pointer;min-width:200px;justify-content:space-between;transition:border-color .15s}
.dp-btn:hover,.dp-btn.open{border-color:var(--accent)}
.dp-btn svg{transition:transform .2s}
.dp-btn.open svg{transform:rotate(180deg)}
.dp-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);min-width:240px;box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:100;overflow:hidden;display:none}
.dp-dropdown.open{display:block}
.dp-month-header{padding:10px 14px;border-bottom:1px solid var(--border);width:100%;background:none;border-left:none;border-right:none;border-top:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer;color:inherit;font-family:inherit}.dp-month-header:hover{background:var(--bg3)}.dp-month-chev{color:var(--text3);flex-shrink:0}
.dp-month-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}
.dp-week{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 14px;background:none;border:none;color:var(--text2);font-size:12px;cursor:pointer;text-align:left;transition:all .15s;border-left:3px solid transparent}
.dp-week:hover{color:var(--text);background:var(--bg3)}
.dp-week.active{color:var(--accent);border-left-color:var(--accent);background:rgba(79,142,247,.06)}
.dp-week.no-data{color:var(--text3);cursor:default}
.dp-week.in-progress{color:var(--amber)}
.dp-week-label{font-weight:600;font-size:12px}
.dp-week-dates{font-size:11px;opacity:.7}
.dp-week-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px}
.wbg-ok{background:rgba(45,212,160,.1);color:var(--green)}
.wbg-live{background:rgba(245,158,11,.1);color:var(--amber)}
.wbg-soon{background:rgba(139,146,168,.08);color:var(--text3)}
/* Status badge */
.blive{display:inline-flex;align-items:center;gap:6px;background:rgba(45,212,160,.1);border:1px solid rgba(45,212,160,.2);color:var(--green);font-size:11px;font-weight:500;padding:4px 10px;border-radius:999px}
.blive-amber{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.2);color:var(--amber)}
.dot2{width:6px;height:6px;border-radius:50%;background:currentColor}
/* Tabs */
.tabs{display:flex;gap:2px;margin-bottom:20px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:4px;flex-wrap:wrap;width:fit-content}
.tab{font-size:13px;font-weight:500;padding:7px 16px;background:none;border:none;color:var(--text2);cursor:pointer;border-radius:6px;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{background:var(--bg3);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sec{display:none}.sec.active{display:block}
/* Week banner */
.week-banner{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:10px 14px;margin-bottom:18px;flex-wrap:wrap;font-size:12px;color:var(--text2)}
.wbl{font-weight:700;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.wbv{font-size:13px;font-weight:600;color:var(--text);margin-top:2px}
.wbsep{width:1px;height:28px;background:var(--border)}
/* Section title */
.sec-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin:20px 0 12px}
/* Client table */
.client-table{width:100%;border-collapse:collapse;font-size:12px}
.client-table th{text-align:left;padding:8px 12px;color:var(--text3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.client-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
.client-table tr:last-child td{border-bottom:none}
.client-table tr:hover td{background:rgba(255,255,255,.02)}
.client-name{font-weight:600;color:var(--text)}
.vol-badge{display:inline-flex;align-items:center;justify-content:center;background:rgba(79,142,247,.12);color:var(--accent);font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;min-width:28px}
.assunto-list{display:flex;flex-wrap:wrap;gap:4px}
.assunto-tag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
/* Bug bar */
.bug-cell{min-width:140px}
.bug-bar-wrap{display:flex;align-items:center;gap:8px}
.bug-bar-track{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;min-width:60px}
.bug-bar-fill{height:100%;border-radius:3px;background:var(--green);transition:width .3s}
.bug-bar-fill.warn{background:var(--amber)}
.bug-bar-fill.crit{background:var(--red)}
.bug-nums{font-size:10px;color:var(--text3);white-space:nowrap}
.bug-nums span{color:var(--text2)}
/* Bot badge */
.bot-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(167,139,250,.1);color:var(--purple);font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px}
.bot-badge.zero{background:var(--bg3);color:var(--text3)}
/* CSM filter */
.csm-filter{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.csm-btn{font-size:12px;font-weight:600;padding:6px 14px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);border-radius:var(--rsm);cursor:pointer;transition:all .15s}
.csm-btn:hover{border-color:var(--accent);color:var(--text)}
.csm-btn.active{background:rgba(79,142,247,.1);border-color:var(--accent);color:var(--accent)}
/* Whizz */
.wh-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.wh-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.wh-card-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.wh-client-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.wh-client-row:last-child{border-bottom:none}
.wh-rank{font-size:11px;color:var(--text3);width:18px;text-align:center}
.wh-bar{flex:1;margin:0 10px;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.wh-bar-fill{height:100%;background:var(--purple);border-radius:2px}
/* Opportunity cards */
.opp-list{display:flex;flex-direction:column;gap:10px}
.opp-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:14px 16px;display:flex;align-items:flex-start;gap:12px}
.opp-card.alta{border-left:3px solid var(--red)}
.opp-card.media{border-left:3px solid var(--amber)}
.opp-card.baixa{border-left:3px solid var(--text3)}
.opp-pri{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap;margin-top:1px}
.opp-pri.alta{background:rgba(242,108,108,.1);color:var(--red)}
.opp-pri.media{background:rgba(245,158,11,.1);color:var(--amber)}
.opp-body{flex:1}
.opp-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.opp-desc{font-size:12px;color:var(--text2);line-height:1.5}
.opp-issues{font-size:11px;color:var(--text3);margin-top:4px}
/* Issues N2 */
.squad-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sfilter-btn{font-size:11px;font-weight:500;padding:4px 10px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);border-radius:5px;cursor:pointer;transition:all .15s}
.sfilter-btn:hover{border-color:var(--accent);color:var(--text)}
.sfilter-btn.sfa{background:rgba(79,142,247,.1);border-color:var(--accent);color:var(--accent)}
.issue-table{width:100%;border-collapse:collapse;font-size:12px}
.issue-table th{text-align:left;padding:7px 10px;color:var(--text3);font-size:11px;font-weight:600;border-bottom:1px solid var(--border)}
.issue-table td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.03);vertical-align:middle}
.issue-table tr:last-child td{border-bottom:none}
.iss-link{color:var(--accent);text-decoration:none;font-weight:600;font-size:11px}
.iss-link:hover{text-decoration:underline}
.st-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap}
.p-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.p-high{background:rgba(242,108,108,.12);color:var(--red)}
.p-med{background:rgba(245,158,11,.12);color:var(--amber)}
.p-low{background:rgba(139,146,168,.1);color:var(--text3)}
.co-tag{font-size:11px;font-weight:500;color:var(--text2)}
/* Summary strip */
.sum-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.sum-chip{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:8px 14px;font-size:12px;color:var(--text2)}
.sum-chip strong{color:var(--text);font-size:14px;display:block;margin-bottom:1px}
/* No data */
.nodata{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;gap:10px;color:var(--text3);text-align:center}
.nodata .ic{font-size:40px;opacity:.3}
/* Footer */
#footer{font-size:11px;color:var(--text3);margin-top:28px;padding-top:14px;border-top:1px solid var(--border)}
@media(max-width:700px){.wh-grid{grid-template-columns:1fr}.client-table td:nth-child(3),.client-table th:nth-child(3){display:none}}

[data-theme="light"]{
  --bg:#f4f6fb;--bg2:#ffffff;--bg3:#e9ecf5;
  --border:rgba(0,0,0,0.08);
  --text:#1a1d2e;--text2:#5a6280;--text3:#9098b4;
  --accent:#3b7ef5;--green:#0aad7c;--amber:#d97706;--red:#dc2626;--purple:#7c3aed
}
[data-theme="light"] body{background:var(--bg)}
[data-theme="light"] .client-table td{border-bottom:1px solid rgba(0,0,0,.04)}
[data-theme="light"] .client-table tr:hover td{background:rgba(0,0,0,.02)}
[data-theme="light"] .tab.active{box-shadow:0 1px 3px rgba(0,0,0,.12)}
[data-theme="light"] .dp-dropdown{box-shadow:0 8px 32px rgba(0,0,0,.12)}
/* theme toggle btn */
.theme-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--bg2);border:1px solid var(--border);
  color:var(--text2);font-size:12px;font-weight:500;
  padding:7px 12px;border-radius:var(--rsm);cursor:pointer;
  transition:all .15s;white-space:nowrap
}
.theme-btn:hover{border-color:var(--accent);color:var(--text)}

.bug-chip{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid transparent;cursor:pointer;transition:all .15s;background:var(--bg3);color:var(--text2)}
.bug-chip:hover{border-color:var(--accent);color:var(--text)}
.bug-chip.active{border-color:currentColor}
.bug-chip.chip-all.active{background:rgba(242,108,108,.12);color:#f26c6c;border-color:#f26c6c}
.bug-chip.chip-open.active{background:rgba(245,158,11,.12);color:#f59e0b;border-color:#f59e0b}
.bug-chip.chip-done.active{background:rgba(45,212,160,.1);color:var(--green);border-color:var(--green)}
.omni-logo{height:26px;display:block;filter:brightness(0) invert(1);transition:filter .2s}
[data-theme="light"] .omni-logo{filter:none}
</style>
</head>

<div class="header">

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">
      <img src="https://omni.chat/wp-content/uploads/2025/12/Conteudo.svg" alt="OmniChat" class="omni-logo">
      <h1>Dashboard de Suporte</h1>

  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">

    <span id="blive" class="blive" style="display:none"><span class="dot2"></span><span id="bliveText"></span></span>

      </button>
      <div class="dp-dropdown" id="dpDropdown"></div>
    </div>
  </div>
</div>
<div id="main"><div class="nodata"><div class="ic">📊</div><p>Selecione uma semana para visualizar os dados</p></div></div>
<div id="footer" style="display:none"></div>

<script>

/* ── THEME TOGGLE ── */
var _theme=(function(){
  try{return localStorage.getItem('omni-dash-theme')||'dark';}catch(e){return 'dark';}
})();

function applyTheme(t){
  _theme=t;
  document.documentElement.setAttribute('data-theme', t==='light'?'light':'');
  var btn=document.getElementById('themeBtn');
  var icon=document.getElementById('themeIcon');
  var label=document.getElementById('themeLabel');
  if(t==='light'){
    if(icon)icon.textContent='🌙';
    if(label)label.textContent='Escuro';
    if(btn)btn.title='Mudar para modo escuro';
  } else {
    if(icon)icon.textContent='☀️';
    if(label)label.textContent='Claro';
    if(btn)btn.title='Mudar para modo claro';
  }
  try{localStorage.setItem('omni-dash-theme',t);}catch(e){}
  // Re-render chart with updated colors if visible
  if(_currentSpMensal && document.getElementById('sp-chart-canvas')){
    var ssp=document.getElementById('ssp');
    if(ssp&&ssp.classList.contains('active')) renderSpChart(_activeCsm,_currentSpMensal);
  }
}

function toggleTheme(){applyTheme(_theme==='light'?'dark':'light');}

function togglePicker(){document.getElementById('dpBtn').classList.toggle('open');document.getElementById('dpDropdown').classList.toggle('open');}
document.addEventListener('click',function(e){var p=document.getElementById('datePicker');if(!p.contains(e.target)){document.getElementById('dpBtn').classList.remove('open');document.getElementById('dpDropdown').classList.remove('open');}});

var MES_OPEN={};
function buildPicker(){
  var groups=[],map={};
  SEMANAS.forEach(function(k){
    var mes=MES[k];
    if(!map[mes]){map[mes]={mes:mes,keys:[]};groups.push(map[mes]);}
    map[mes].keys.push(k);
  });
  if(Object.keys(MES_OPEN).length===0){
    groups.forEach(function(g,i){MES_OPEN[g.mes]=(i===groups.length-1);});
  }
  var html='';
  groups.forEach(function(g,gi){
    var open=!!MES_OPEN[g.mes];
    html+='<button type="button" class="dp-month-header dp-month-toggle" onclick="toggleMes(\''+g.mes+'\')"'+(gi>0?' style="margin-top:4px;border-top:1px solid var(--border)"':'')+'>'
      +'<div class="dp-month-title">🗓️ '+g.mes+'</div>'
      +'<svg width="12" height="12" viewBox="0 0 14 14" fill="none" class="dp-month-chev" style="transition:transform .2s;transform:rotate('+(open?'180':'0')+'deg)"><path d="M2 5l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      +'</button>';
    html+='<div style="display:'+(open?'block':'none')+'">';
    g.keys.forEach(function(k){
      var st=STATUS[k];
      var cls='dp-week'+(st==='pendente'?' no-data':st==='em-andamento'?' in-progress':'');
      var badge=st==='completa'?'<span class="dp-week-badge wbg-ok">Completa</span>':st==='em-andamento'?'<span class="dp-week-badge wbg-live">Em andamento</span>':'<span class="dp-week-badge wbg-soon">Em breve</span>';
      var onclick=st!=='pendente'?'onclick="selectWeek(\''+k+'\')"':'';
      html+='<button class="'+cls+'" id="dp-'+k+'" '+onclick+'><div class="dp-week-info"><div class="dp-week-label">'+LABELS[k]+'</div><div class="dp-week-dates">'+DATAS[k]+'</div></div>'+badge+'</button>';
    });
    html+='</div>';
  });
  document.getElementById('dpDropdown').innerHTML=html;
}
function toggleMes(mes){
  MES_OPEN[mes]=!MES_OPEN[mes];
  buildPicker();
}

function selectWeek(key){
  if(STATUS[key]==='pendente') return;
  document.getElementById('dpLabel').textContent=LABELS[key];
  document.querySelectorAll('.dp-week').forEach(function(b){b.classList.remove('active');});
  var db=document.getElementById('dp-'+key);if(db)db.classList.add('active');
  document.getElementById('dpBtn').classList.remove('open');
  document.getElementById('dpDropdown').classList.remove('open');
  renderWeek(key);
}

/* ── HELPERS ── */
function bugBar(abertas,concluidas){
  var total=abertas+concluidas;
  if(total===0) return '<span style="color:var(--text3);font-size:11px">Sem issues</span>';
  var pct=Math.round(concluidas/total*100);
  var cls=pct>=70?'':'pct>=40?warn:crit';
  if(pct>=70) cls='';else if(pct>=40) cls=' warn';else cls=' crit';
  return '<div class="bug-bar-wrap"><div class="bug-bar-track"><div class="bug-bar-fill'+cls+'" style="width:'+pct+'%"></div></div>'
    +'<span class="bug-nums"><span>'+concluidas+'✓</span> / '+total+' ('+pct+'%)</span></div>';
}

function ajusteBadges(bot,whizz){
  var h='';
  h+=(bot?'<span class="bot-badge">🤖 '+bot+'</span>':'<span class="bot-badge zero">—</span>');
  h+=' '+(whizz?'<span class="bot-badge" style="background:rgba(45,212,160,.1);color:var(--green)">🧠 '+whizz+'</span>':'<span class="bot-badge zero" style="background:var(--bg3);color:var(--text3)">—</span>');
  return h;
}

function assuntosList(arr){
  if(!arr||!arr.length) return '—';
  return '<div class="assunto-list">'+arr.slice(0,3).map(function(a){return '<span class="assunto-tag">'+a+'</span>';}).join('')+'</div>';
}

function mkClientTable(clientes,showTotal){
  if(!clientes||!clientes.length) return '<div class="nodata" style="min-height:120px"><p>Nenhum cliente nesta semana</p></div>';
  var total=clientes.reduce(function(s,c){return s+c.volume;},0);
  var totalBot=clientes.reduce(function(s,c){return s+(c.bot_ajuste||0);},0);
  var totalWhizz=clientes.reduce(function(s,c){return s+(c.whizz_ajuste||0);},0);
  var h='';
  if(showTotal){
    h+='<div class="sum-strip">'
      +'<div class="sum-chip"><strong>'+clientes.length+'</strong>clientes</div>'
      +'<div class="sum-chip"><strong>'+total+'</strong>chamados</div>'
      
      +'<div class="sum-chip"><strong>'+totalBot+'</strong>ajustes BOT</div>'+'<div class="sum-chip"><strong>'+totalWhizz+'</strong>ajustes Whizz</div>'
      +'</div>';
  }
  h+='<table class="client-table"><thead><tr>'
    +'<th>#</th><th>Cliente</th><th>Vol.</th><th>Principais assuntos</th><th style="white-space:nowrap">🤖 BOT</th><th style="white-space:nowrap">🧠 Whizz</th>'
    +'</tr></thead><tbody>';
  clientes.sort(function(a,b){return b.volume-a.volume;}).forEach(function(c,i){
    h+='<tr><td style="color:var(--text3);width:28px">'+(i+1)+'</td>'
      +'<td><span class="client-name">'+c.nome+'</span></td>'
      +'<td style="white-space:nowrap"><span style="font-weight:700;color:var(--text);font-size:13px">'+c.volume+'</span></td>'
      +'<td>'+assuntosList(c.assuntos)+'</td>'
      
      +'<td>'+(c.bot_ajuste?'<span class="bot-badge">🤖 '+c.bot_ajuste+'</span>':'<span class="bot-badge zero">—</span>')+'</td>'+'<td>'+(c.whizz_ajuste?'<span class="bot-badge" style="background:rgba(45,212,160,.1);color:var(--green)">🧠 '+c.whizz_ajuste+'</span>':'<span class="bot-badge zero" style="background:var(--bg3);color:var(--text3)">—</span>')+'</td>'
      +'</tr>';
  });
  h+='</tbody></table>';
  return h;
}

var _activeCsm='Nayara';

/* ── SP BUGS LIST ── */
var SLA_PRI={"Triagem N3":1,"Aguardando Validação":2,"Em Desenvolvimento":3,"Selecionado p/ Desenvolvimento":4,"Aguardando Deploy Prod":5,"Concluído":6};

function bugStatusStyle(s){
  var map={
    "Concluído":                    "background:rgba(45,212,160,.12);color:var(--green)",
    "Em Desenvolvimento":           "background:rgba(79,142,247,.12);color:var(--accent)",
    "Selecionado p/ Desenvolvimento":"background:rgba(79,142,247,.08);color:#7cb9f5",
    "Triagem N3":                   "background:rgba(245,158,11,.12);color:#f59e0b",
    "Aguardando Validação":         "background:rgba(245,158,11,.12);color:#f59e0b",
    "Aguardando Deploy Prod":       "background:rgba(167,139,250,.12);color:var(--purple)"
  };
  return map[s]||"background:rgba(139,146,168,.1);color:var(--text3)";
}

function filterBugs(cid,filter,btn){
  var wrap=document.getElementById(cid);if(!wrap)return;
  wrap.querySelectorAll('.bug-chip').forEach(function(c){c.classList.remove('active');});
  if(btn)btn.classList.add('active');
  wrap.querySelectorAll('.bug-row').forEach(function(r){
    var open=r.getAttribute('data-open')==='true';
    r.style.display=(filter==='all'||( filter==='open'&&open)||(filter==='done'&&!open))?'':'none';
  });
}

function mkBugsList(bugs,csmName){
  if(!bugs||!bugs.length) return '<div style="color:var(--text3);font-size:12px;padding:8px 0">Nenhuma issue aberta nesta semana</div>';
  var cid='bugs-'+csmName.replace(/[^a-zA-Z]/g,'');
  var conc=bugs.filter(function(b){return b.s==='Concluído';}).length;
  var abrt=bugs.length-conc;
  // Sort: open first by SLA priority, then concluded; within group by key number asc (older first)
  var sorted=bugs.slice().sort(function(a,b){
    var pa=SLA_PRI[a.s]||3, pb=SLA_PRI[b.s]||3;
    if(pa!==pb)return pa-pb;
    return parseInt(a.k.replace('S3-',''),10)-parseInt(b.k.replace('S3-',''),10);
  });
  var h='<div id="'+cid+'">';
  h+='<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center">';
  h+='<button class="bug-chip chip-all active" onclick="filterBugs(\''+cid+'\',\'all\',this)">🐛 '+bugs.length+' issues esta semana</button>';
  if(abrt)h+='<button class="bug-chip chip-open" onclick="filterBugs(\''+cid+'\',\'open\',this)">'+abrt+' em aberto</button>';
  if(conc)h+='<button class="bug-chip chip-done" onclick="filterBugs(\''+cid+'\',\'done\',this)">'+conc+' concluídas</button>';
  h+='</div>';
  h+='<div style="display:flex;flex-direction:column;gap:4px">';
  sorted.forEach(function(b){
    var isOpen=b.s!=='Concluído';
    var url='https://omnichat.atlassian.net/browse/'+b.k;
    var slaStyle=isOpen?'border-left:2px solid #f59e0b':'border-left:2px solid rgba(45,212,160,.3)';
    h+='<div class="bug-row" data-open="'+isOpen+'" style="display:flex;align-items:center;gap:8px;padding:5px 8px 5px 10px;background:var(--bg3);border-radius:6px;font-size:12px;'+slaStyle+'">'
      +'<a href="'+url+'" target="_blank" style="color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap">'+b.k+'</a>'
      +'<span style="flex:1;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+b.t+'">'+b.t+'</span>'
      +'<span style="'+bugStatusStyle(b.s)+';padding:2px 8px;border-radius:12px;white-space:nowrap;font-size:11px">'+b.s+'</span>'
      +'</div>';
  });
  h+='</div>';
  h+='<div style="margin-top:6px;font-size:10px;color:var(--text3)">⚠️ Issues atribuídas via reporter (CSM). Para vincular ao cliente, inclua o nome no título: ex: "Erro no Whizz | Cobasi"</div>';
  h+='</div>';
  return h;
}

function mkSpTab(sp){
  if(!sp||!sp.carteiras) return '<div class="nodata"><p>Sem dados SP</p></div>';
  var csms=Object.keys(sp.carteiras);
  var h='<div class="csm-filter">';
  csms.forEach(function(csm){
    h+='<button class="csm-btn'+(csm===_activeCsm?' active':'')+'" onclick="switchCsm(\''+csm+'\',this)">'+csm+'</button>';
  });
  h+='</div>';
  // Chart section
  h+='<div style="margin:16px 0 20px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px">';
  h+='<div class="sec-title" style="margin:0 0 12px">📊 Distribuição mensal — % de atendimentos por cliente</div>';
  h+='<div style="position:relative;height:260px"><canvas id="sp-chart-canvas"></canvas></div>';
  h+='</div>';
  // Client table panels
  h+='<div id="sp-panels">';
  csms.forEach(function(csm){
    var cart=sp.carteiras[csm];
    h+='<div id="csm-'+csm+'" style="display:'+(csm===_activeCsm?'block':'none')+'">';
    h+=mkClientTable(cart.clientes,true);
    h+='<div style="margin-top:16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px">'
      +'<div class="sec-title" style="margin:0 0 10px;font-size:13px">🐛 Issues S3 — Carteira '+csm+'</div>'
      +mkBugsList(cart.bugs||[],csm)
      +'</div>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}
function switchCsm(csm,btn){
  _activeCsm=csm;
  document.querySelectorAll('.csm-btn').forEach(function(b){b.classList.remove('active');});
  if(btn) btn.classList.add('active');
  var panels=document.getElementById('sp-panels');
  if(panels){[].forEach.call(panels.children,function(d){d.style.display='none';});}
  var el=document.getElementById('csm-'+csm);if(el)el.style.display='block';
  if(_currentSpMensal) renderSpChart(csm,_currentSpMensal);
}

function mkWhizzTab(wh,n2){

  h+='</div>';
  // Tipo de issue
  var total=wh.por_tipo.bugs+wh.por_tipo.duvidas+wh.por_tipo.ajustes;
  h+='<div class="wh-card"><div class="wh-card-title">📊 Tipo de issue Whizz</div>'
    +'<div style="display:flex;flex-direction:column;gap:10px;margin-top:4px">';
  [{label:'🐛 Bugs',val:wh.por_tipo.bugs,cor:'var(--red)'},{label:'❓ Dúvidas',val:wh.por_tipo.duvidas,cor:'var(--accent)'},{label:'⚙️ Ajustes',val:wh.por_tipo.ajustes,cor:'var(--purple)'}].forEach(function(t){
    var p=total?Math.round(t.val/total*100):0;
    h+='<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span style="color:var(--text2)">'+t.label+'</span><span style="color:'+t.cor+';font-weight:700">'+t.val+' <span style="opacity:.6">('+p+'%)</span></span></div>'
      +'<div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden"><div style="width:'+p+'%;height:100%;background:'+t.cor+';border-radius:3px"></div></div></div>';
  });
  h+='</div></div></div>';
  // Oportunidades
  h+='<div class="sec-title">💡 Oportunidades de melhoria</div><div class="opp-list">';
  wh.oportunidades.forEach(function(o){
    h+='<div class="opp-card '+o.prioridade+'">'
      +'<span class="opp-pri '+o.prioridade+'">'+o.prioridade.charAt(0).toUpperCase()+o.prioridade.slice(1)+'</span>'
      +'<div class="opp-body"><div class="opp-title">'+o.titulo+'</div>'
      +'<div class="opp-desc">'+o.descricao+'</div>'
      +'<div class="opp-issues">'
      +(o.jql?'<a href="https://omnichat.atlassian.net/issues/?jql='+encodeURIComponent(o.jql)+'" target="_blank" style="color:var(--accent);text-decoration:none;font-weight:600">'+o.issues+' issues</a>':o.issues+' issues')
      +' · Squad: '+o.squad
      +'</div>'

      +'</div></div>';
  });
  h+='</div>';
  // ── Issues por squad Whizz ──────────────────────────────────────────
  if(n2&&n2.jira_issues){
    var WHIZZ_SQUADS=['Commerce','Whizz Core','Whizz Retail'];
    var whIssues=[];
    WHIZZ_SQUADS.forEach(function(sq){
      (n2.jira_issues[sq]||[]).forEach(function(i){
        whIssues.push({k:i.k,t:i.t,s:i.s,squad:sq});
      });
    });
    if(whIssues.length){
      h+='<div style="margin-top:20px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px">';
      h+='<div class="sec-title" style="margin:0 0 10px;font-size:13px">🐛 Issues Whizz esta semana — Commerce + Whizz Core</div>';
      h+=mkBugsList(whIssues,'Whizz');
      h+='</div>';
    }
  }
  return h;
}

/* ── N2 ISSUES ── */
var N2F_V2={};
var ST_COLOR={'Concluído':'#2dd4a0','Triagem N3':'#f59e0b','Triagem Suporte N3':'#f59e0b','Aguardando Validação':'#a78bfa','Aguardando Relator':'#4f8ef7','Em Desenvolvimento':'#4f8ef7','Em Andamento N2':'#4f8ef7','Selecionado p/ Desenvolvimento':'#4f8ef7','Triagem Suporte N2':'#f59e0b','Aguardando Deploy Prod':'#a78bfa','Aguardando por Fator Externo':'#f59e0b'};
var P_CLS={'High':'p-high','Medium':'p-med','Low':'p-low'};

function mkIssueRow(i){
  var sc=ST_COLOR[i.s]||'#555d75';
  var pc=P_CLS[i.p]||'p-low';
  return '<tr>'
    +'<td><a class="iss-link" href="https://omnichat.atlassian.net/browse/'+i.k+'" target="_blank">'+i.k+'</a></td>'
    +'<td style="color:var(--text);max-width:300px">'+i.t+'</td>'
    +'<td><span class="st-badge" style="background:'+sc+'22;color:'+sc+'">'+i.s+'</span></td>'
    +'<td><span class="p-badge '+pc+'">'+i.p+'</span></td>'
    +'<td class="co-tag">'+i.co+'</td>'
    +'<td style="color:var(--text2);font-size:11px">'+(i.a||'—')+'</td>'
    +'</tr>';
}

function applyN2FilterV2(pfx,issues){
  var f=N2F_V2[pfx]||{squad:'Todos',status:'Todos'};
  var squads=Object.keys(issues);
  var squadRows=f.squad==='Todos'?squads.reduce(function(acc,k){return acc.concat(issues[k]||[]);},[]):(issues[f.squad]||[]);
  // update status counts
  var stBtns=document.querySelectorAll('[id^="'+pfx+'-st-"]');
  stBtns.forEach(function(b){
    var st=b.getAttribute('data-st');
    if(!st||st==='Todos')return;
    var cnt=squadRows.filter(function(r){return r.s===st;}).length;
    b.innerHTML=st+' <span style="opacity:.6">('+cnt+')</span>';
  });
  var rows=squadRows.slice();
  if(f.status&&f.status!=='Todos') rows=rows.filter(function(r){return r.s===f.status;});
  var tbody=document.getElementById(pfx+'-tbody');
  if(tbody) tbody.innerHTML=rows.map(mkIssueRow).join('');
}

function filterSquadV2(pfx,squad,issues){
  if(!N2F_V2[pfx])N2F_V2[pfx]={squad:'Todos',status:'Todos'};
  N2F_V2[pfx].squad=squad||'Todos';
  var squads=Object.keys(issues);
  squads.forEach(function(sq){var b=document.getElementById(pfx+'-sq-'+sq);if(b)b.className='sfilter-btn'+(sq===N2F_V2[pfx].squad?' sfa':'');});
  var tb=document.getElementById(pfx+'-sq-Todos');if(tb)tb.className='sfilter-btn'+(N2F_V2[pfx].squad==='Todos'?' sfa':'');
  applyN2FilterV2(pfx,issues);
}

function filterStatusV2(pfx,status,issues){
  if(!N2F_V2[pfx])N2F_V2[pfx]={squad:'Todos',status:'Todos'};
  N2F_V2[pfx].status=status||'Todos';
  document.querySelectorAll('[id^="'+pfx+'-st-"]').forEach(function(b){
    b.className='sfilter-btn'+(b.getAttribute('data-st')===N2F_V2[pfx].status?' sfa':'');
  });
  applyN2FilterV2(pfx,issues);
}

function mkN2Tab(n2,key){
  if(!n2||!n2.jira_issues) return '<div class="nodata"><p>Sem dados N2</p></div>';
  var issues=n2.jira_issues;
  var squads=Object.keys(issues);
  var allIssues=squads.reduce(function(acc,k){return acc.concat(issues[k]||[]);},[]);
  var pfx='n2v2-'+key;
  // status set
  var statusSet={};allIssues.forEach(function(i){if(i.s)statusSet[i.s]=true;});
  var stList=Object.keys(statusSet);
  var h='<div class="sum-strip">'
    +'<div class="sum-chip"><strong>'+allIssues.length+'</strong>issues total</div>'
    +'<div class="sum-chip"><strong>'+allIssues.filter(function(i){return i.s==='Concluído';}).length+'</strong>concluídas</div>'
    +'<div class="sum-chip"><strong>'+allIssues.filter(function(i){return i.s!=='Concluído';}).length+'</strong>em aberto</div>'
    +'</div>';
  // squad filter
  h+='<div class="squad-filter">';
  h+='<button class="sfilter-btn sfa" id="'+pfx+'-sq-Todos" onclick="filterSquadV2(\''+pfx+'\',\'Todos\',DADOS[\''+key+'\'].n2.jira_issues)">Todos ('+allIssues.length+')</button>';
  squads.forEach(function(sq){
    var cnt=(issues[sq]||[]).length;if(!cnt)return;
    h+='<button class="sfilter-btn" id="'+pfx+'-sq-'+sq+'" onclick="filterSquadV2(\''+pfx+'\',\''+sq+'\',DADOS[\''+key+'\'].n2.jira_issues)">'+sq+' ('+cnt+')</button>';
  });
  h+='</div>';
  // status filter
  h+='<div style="margin:10px 0 12px"><div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">Filtrar por status</div>';
  h+='<div class="squad-filter">';
  h+='<button class="sfilter-btn sfa" id="'+pfx+'-st-Todos" data-st="Todos" onclick="filterStatusV2(\''+pfx+'\',\'Todos\',DADOS[\''+key+'\'].n2.jira_issues)">Todos</button>';
  stList.forEach(function(st,si){
    var cnt=allIssues.filter(function(i){return i.s===st;}).length;
    var sc=ST_COLOR[st]||'#555d75';
    h+='<button class="sfilter-btn" id="'+pfx+'-st-'+si+'" data-st="'+st+'" onclick="filterStatusV2(\''+pfx+'\',\''+st+'\',DADOS[\''+key+'\'].n2.jira_issues)" style="color:'+sc+'">'+st+' <span style="opacity:.6">('+cnt+')</span></button>';
  });
  h+='</div></div>';
  // table
  h+='<div style="overflow-x:auto"><table class="issue-table"><thead><tr>'
    +'<th>Issue</th><th>Título</th><th>Status</th><th>P</th><th>Empresa</th><th>Responsável</th>'
    +'</tr></thead><tbody id="'+pfx+'-tbody">'
    +allIssues.map(mkIssueRow).join('')
    +'</tbody></table></div>';
  return h;
}


/* ── SP MENSAL: agrega todas as semanas do mês disponíveis ── */
var _spChartInst=null;

function calcSpMensal(weekKey){
  var month=weekKey.replace(/^s\d+-/,''); // e.g. "jun2026"
  var agg={};
  SEMANAS.forEach(function(k){
    if(k.indexOf(month)===-1) return;
    var d=DADOS[k];
    if(!d||!d.disponivel||!d.sp) return;
    Object.keys(d.sp.carteiras).forEach(function(csm){
      if(!agg[csm])agg[csm]={};
      (d.sp.carteiras[csm].clientes||[]).forEach(function(cl){
        if(!agg[csm][cl.nome])agg[csm][cl.nome]={volume:0,bot_ajuste:0,whizz_ajuste:0,assuntos:cl.assuntos||[]};
        agg[csm][cl.nome].volume+=cl.volume;
        agg[csm][cl.nome].bot_ajuste+=(cl.bot_ajuste||0);
        agg[csm][cl.nome].whizz_ajuste+=(cl.whizz_ajuste||0);
      });
    });
  });
  var result={};
  Object.keys(agg).forEach(function(csm){
    var list=Object.keys(agg[csm]).map(function(nome){
      return Object.assign({nome:nome},agg[csm][nome]);
    });
    list.sort(function(a,b){return b.volume-a.volume;});
    result[csm]=list;
  });
  return result;
}

function renderSpChart(csm,mensal){
  var clientes=(mensal[csm]||[]).slice(0,8);
  var total=clientes.reduce(function(s,c){return s+c.volume;},0)||1;
  var canvas=document.getElementById('sp-chart-canvas');
  if(!canvas)return;
  if(_spChartInst){_spChartInst.destroy();_spChartInst=null;}
  var PALETTE=['rgba(79,142,247,.85)','rgba(167,139,250,.85)','rgba(45,212,160,.85)','rgba(245,158,11,.85)','rgba(242,108,108,.85)','rgba(96,165,250,.85)','rgba(251,191,36,.85)','rgba(52,211,153,.85)'];
  _spChartInst=new Chart(canvas,{
    type:'bar',
    data:{
      labels:clientes.map(function(c){var n=c.nome;return n.length>22?n.slice(0,20)+'…':n;}),
      datasets:[{
        data:clientes.map(function(c){return Math.round(c.volume/total*100);}),
        backgroundColor:PALETTE.slice(0,clientes.length),
        borderRadius:6,borderSkipped:false
      }]
    },
    options:{
      indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:function(ctx){
          var cl=clientes[ctx.dataIndex];
          return ctx.raw+'% do total ('+cl.volume+' atend.)';
        }}}
      },
      scales:{
        x:{max:100,grid:{color:'rgba(255,255,255,.05)'},border:{color:'rgba(255,255,255,.08)'},
          ticks:{color:'#8b92a8',callback:function(v){return v+'%';}}},
        y:{grid:{display:false},ticks:{color:'#f0f2f8',font:{size:11}}}
      }
    }
  });
}

/* ── RENDER WEEK ── */
function showTab(id,btn){
  document.querySelectorAll('.sec').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.getElementById(id).classList.add('active');btn.classList.add('active');
  if(id==='ssp'&&_currentSpMensal) setTimeout(function(){renderSpChart(_activeCsm,_currentSpMensal);},20);
}

function ndCard(msg){return '<div class="nodata"><div class="ic">📅</div><p>'+msg+'</p></div>';}

function renderWeek(key){
  var d=DADOS[key],blive=document.getElementById('blive'),footer=document.getElementById('footer');
  if(!key||!d){
    blive.style.display='none';footer.style.display='none';
    document.getElementById('main').innerHTML='<div class="nodata"><div class="ic">📊</div><p>Selecione uma semana</p></div>';
    document.getElementById('subtitle').textContent='Omni · Suporte — Selecione a semana';return;
  }
  document.getElementById('subtitle').textContent='Omni · '+MES[key]+' · '+LABELS[key];
  var isLive=STATUS[key]==='em-andamento';
  blive.className='blive'+(isLive?' blive-amber':'');
  blive.style.display='inline-flex';
  document.getElementById('bliveText').textContent=isLive?'Em andamento':'Semana concluída';
  footer.style.display='block';
  footer.innerHTML=d.disponivel
    ?'Fonte: Intercom · Jira S3 · Gerado em '+(d.gerado||'--')+' · Omni Suporte'
    :'Dados não disponíveis para '+LABELS[key];

  if(!d.disponivel){
    var msg=isLive?'Semana em andamento — dados disponíveis ao final do período.':'Semana ainda não iniciada.';
    document.getElementById('main').innerHTML=
      '<div class="tabs"><button class="tab active" onclick="showTab(\'stt\',this)">TechTouch</button>'
      +'<button class="tab" onclick="showTab(\'sob\',this)">Onboarding</button>'
      +'<button class="tab" onclick="showTab(\'ssp\',this)">SP por CSM</button>'
      +'<button class="tab" onclick="showTab(\'swh\',this)">🤖 Whizz</button>'
      +'<button class="tab" onclick="showTab(\'sn2\',this)">Issues N2</button></div>'
      +'<div id="stt" class="sec active">'+ndCard(msg)+'</div>'
      +'<div id="sob" class="sec">'+ndCard(msg)+'</div>'
      +'<div id="ssp" class="sec">'+ndCard(msg)+'</div>'
      +'<div id="swh" class="sec">'+ndCard(msg)+'</div>'
      +'<div id="sn2" class="sec">'+ndCard(msg)+'</div>';
    return;
  }

  document.getElementById('main').innerHTML=
    '<div class="tabs">'
    +'<button class="tab active" onclick="showTab(\'stt\',this)">TechTouch</button>'
    +'<button class="tab" onclick="showTab(\'sob\',this)">Onboarding</button>'
    +'<button class="tab" onclick="showTab(\'ssp\',this)">SP por CSM</button>'
    +'<button class="tab" onclick="showTab(\'swh\',this)">🤖 Whizz</button>'
    +'<button class="tab" onclick="showTab(\'sn2\',this)">Issues N2</button>'
    +'</div>'
    +'<div id="stt" class="sec active"><div class="sec-title">TechTouch — Top clientes N1</div><div style="font-size:11px;color:var(--text3);margin-bottom:10px;padding:6px 10px;background:rgba(79,142,247,.06);border-radius:6px;border-left:3px solid var(--accent)">Clientes que entram pelo suporte padrão (tag "Resolvido N1"). Clientes SP têm atendimento dedicado e aparecem na aba SP por CSM.</div>'+mkClientTable(d.techtouch&&d.techtouch.clientes,true)+'<div style="margin-top:16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px"><div class="sec-title" style="margin:0 0 10px;font-size:13px">🐛 Issues S3 — TechTouch / N1</div>'+mkBugsList((d.techtouch&&d.techtouch.bugs)||[],"TechTouch")+'</div></div>'
    +'<div id="sob" class="sec"><div class="sec-title">Onboarding — Clientes em implantação</div>'+mkClientTable(d.onboarding&&d.onboarding.clientes,true)+'<div style="margin-top:16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px"><div class="sec-title" style="margin:0 0 10px;font-size:13px">🐛 Issues S3 — Onboarding</div>'+mkBugsList((d.onboarding&&d.onboarding.bugs)||[],"Onboarding")+'</div></div>'
    +(function(){
  var _m=calcSpMensal(key);_currentSpMensal=_m;
  return '<div id="ssp" class="sec"><div class="sec-title">SP Sucesso Premium — Por carteira CSM</div><div style="font-size:11px;color:var(--text3);margin-bottom:10px;padding:6px 10px;background:rgba(167,139,250,.06);border-radius:6px;border-left:3px solid var(--purple)">Organizações com tag \"Resolvido Premium\" no Intercom, agrupadas pela carteira do CSM responsável.</div>'+mkSpTab(d.sp)+'</div>';
})()
    +'<div id="swh" class="sec"><div class="sec-title">Whizz — Análise de issues e oportunidades</div>'+mkWhizzTab(d.whizz,d.n2)+'</div>'
    +'<div id="sn2" class="sec"><div class="sec-title">Issues N2 — Visão completa Jira S3</div>'+mkN2Tab(d.n2,key)+'</div>';
  // Render SP chart after DOM is ready
  setTimeout(function(){if(_currentSpMensal)renderSpChart(_activeCsm,_currentSpMensal);},50);
}

window.addEventListener('load',function(){applyTheme(_theme);
  buildPicker();
  var latest=null;
  for(var i=SEMANAS.length-1;i>=0;i--){if(DADOS[SEMANAS[i]]&&DADOS[SEMANAS[i]].disponivel){latest=SEMANAS[i];break;}}
  if(latest) selectWeek(latest);
});
</script>
